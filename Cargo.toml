[workspace]
resolver = "3"
members = [
    "crates/flashraw",
    "crates/flashraw-core",
    "crates/flashraw-codecs",
    "crates/flashraw-formats",
    "crates/flashraw-camera-db",
    "crates/flashraw-gpu",
    "crates/flashraw-cli",
    "crates/flashraw-wasm",
    "crates/flashraw-python",
    "crates/flashraw-capi",
    "crates/flashraw-libraw-compat",
]
# The Python extension (crates/flashraw-python) is built with maturin, not by default.
default-members = [
    "crates/flashraw",
    "crates/flashraw-core",
    "crates/flashraw-codecs",
    "crates/flashraw-formats",
    "crates/flashraw-camera-db",
    "crates/flashraw-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ybouane/flashraw"
authors = ["Yassine Bouanane"]

[workspace.dependencies]
flashraw = { path = "crates/flashraw", version = "0.1.0", default-features = false }
flashraw-core = { path = "crates/flashraw-core", version = "0.1.0" }
flashraw-codecs = { path = "crates/flashraw-codecs", version = "0.1.0" }
flashraw-formats = { path = "crates/flashraw-formats", version = "0.1.0" }
flashraw-camera-db = { path = "crates/flashraw-camera-db", version = "0.1.0" }
flashraw-gpu = { path = "crates/flashraw-gpu", version = "0.1.0" }
rayon = "1.12"
memmap2 = "0.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
zune-jpeg = "0.4"
zune-inflate = { version = "0.2", default-features = false, features = ["zlib"] }
zlib-rs = { version = "0.6", default-features = false, features = ["rust-allocator"] }
jxl-oxide = "0.12"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
proptest = "1"
criterion = { version = "0.8", default-features = false }
toml = "1"
jpeg-encoder = "0.7"
moxcms = "0.8"

[workspace.lints.clippy]
# Indexed loops are the clearest form for the numeric kernels (IDCT, matrices, CFA tables).
needless_range_loop = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# Size-optimised profile for the WASM build (see docs/wasm.md).
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"
strip = true

# Optimisation keeps the test suite usable on large corpus files.
[profile.dev.package."*"]
opt-level = 2
[profile.test]
opt-level = 2
