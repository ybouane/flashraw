<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 626" width="960" height="626" role="img" aria-labelledby="t d">
<title id="t">RAW to RGB time relative to FlashRaw</title>
<desc id="d">LibRaw + Little CMS: Linux 15.017, macOS 21.824 times FlashRaw's time; dcraw: Linux 9.984, macOS 23.035 times FlashRaw's time; rawpy: Linux 9.503, macOS 20.508 times FlashRaw's time; LibRaw: Linux 8.806, macOS 15.393 times FlashRaw's time; rawler: Linux 6.56, macOS 6.668 times FlashRaw's time; FlashRaw: Linux 1.0, macOS 1.0 times FlashRaw's time; FlashRaw GPU: Linux None, macOS 0.8347245409015025 times FlashRaw's time</desc>
