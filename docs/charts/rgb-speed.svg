<title id="t">RAW to RGB time relative to FlashRaw</title>
<desc id="d">LibRaw + Little CMS: Linux 20.823, macOS 29.397 times FlashRaw's time; rawpy: Linux 13.217, macOS 25.158 times FlashRaw's time; dcraw: Linux 12.517, macOS 27.92 times FlashRaw's time; LibRaw: Linux 11.823, macOS 22.128 times FlashRaw's time; rawler: Linux 9.001, macOS 7.238 times FlashRaw's time; FlashRaw: Linux 1.0, macOS 1.0 times FlashRaw's time; FlashRaw GPU: Linux None, macOS 0.8525149190110827 times FlashRaw's time</desc>
