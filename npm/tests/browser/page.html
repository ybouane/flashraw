<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flashraw browser test</title>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  // Driven by tests/browser/run.mjs. Query: ?simd=0 forces the fallback binary, ?threads=0|N
  // the single-threaded build / N threads, ?gpu=1 loads the WebGPU build and runs GPU checks,
  // ?nogpu=1 hides navigator.gpu.
  import * as fr from '/dist/browser.js';
  import { createWorkerPool } from '/dist/worker.browser.js';

  function fnv1a64U16(data) {
    let lo = 0x84222325, hi = 0xcbf29ce4;
    const step = (b) => {
      lo ^= b;
      const l = (lo >>> 0) * 0x1b3;
      const carry = Math.floor(l / 4294967296);
      hi = ((hi >>> 0) * 0x1b3 + carry + ((lo << 8) >>> 0)) >>> 0;
      lo = l >>> 0;
    };
    for (let i = 0; i < data.length; i++) { step(data[i] & 0xff); step(data[i] >>> 8); }
    return (hi >>> 0).toString(16).padStart(8, '0') + (lo >>> 0).toString(16).padStart(8, '0');
  }

  function diff(a, b) {
    if (a.length !== b.length) return { length: [a.length, b.length] };
    let max = 0, count = 0;
    for (let i = 0; i < a.length; i++) {
      const d = Math.abs(a[i] - b[i]);
      if (d) { count++; if (d > max) max = d; }
    }
    return { max, count, fraction: count / a.length };
  }

  async function gpuChecks(name) {
    const blob = await (await fetch(`/tests/fixtures/${name}`)).blob();
    const raw = await fr.FlashRaw.open(blob);
    const out = { device: !!(await fr.getGpuDevice()) };
    // The fixture carries a DNG opcode list (bad pixels): host outputs that it changes are
    // decoded by the CPU pipeline; without opcodes the GPU unpacks and develops.
    out.opcodes = (await raw.decode({ backend: 'gpu', output: 'rgba8' })).backend.kind;
    const cpu = await raw.decode({ output: 'rgba8', applyOpcodes: false });
    const g = await raw.decode({ backend: 'gpu', output: 'rgba8', applyOpcodes: false });
    out.rgba = { kind: g.backend.kind, adapter: g.backend.gpuAdapter, fallbackReason: g.backend.fallbackReason, size: [g.width, g.height], diff: diff(cpu.data, g.data) };
    const r = await raw.decode({ output: 'gpu-rgba8' });
    if (r instanceof fr.GpuFrame) {
      const tex = r.createTexture();
      const d = await r.download();
      out.resident = {
        gpu: true, output: r.output, byteLength: r.byteLength, format: r.format, bufferSize: Number(r.buffer.size),
        sameDevice: r.device === (await fr.getGpuDevice()), texture: [tex.width, tex.height, tex.format],
        downloaded: d.output, diff: diff(cpu.data, d.data),
      };
      tex.destroy();
      const owned = (await raw.decode({ output: 'gpu-rgba8' })).detachBuffer();
      out.resident.detached = Number(owned.size) >= r.byteLength;
      owned.destroy();
      r.free();
    } else {
      out.resident = { gpu: false, kind: r.backend.kind, output: r.output, fallbackReason: r.backend.fallbackReason };
    }
    out.error = await raw.decode({ output: 'gpu-rgba8', fallback: 'error' }).then((f) => { f.free?.(); return null; }, (e) => ({ name: e.name, kind: e.kind }));
    raw.close();
    return out;
  }

  async function run() {
    const q = new URLSearchParams(location.search);
    // ?nogpu=1: behave like a browser without WebGPU.
    if (q.get('nogpu') === '1') Object.defineProperty(Navigator.prototype, 'gpu', { get: () => undefined, configurable: true });
    const t0 = performance.now();
    const opts = {};
    if (q.get('simd') === '0') opts.simd = false;
    if (q.has('threads')) opts.threads = q.get('threads') === '0' ? false : Number(q.get('threads'));
    if (q.get('gpu') === '1') opts.gpu = true;
    const info = await fr.init(opts);
    const initMs = performance.now() - t0;
    const caps = await fr.getCapabilities();
    const out = { info, initMs, caps, files: {} };
    if (q.get('gpu') === '1') out.gpu = await gpuChecks((q.get('files') ?? '').split(',')[0]);
    for (const name of (q.get('files') ?? '').split(',').filter(Boolean)) {
      const resp = await fetch(`/tests/fixtures/${name}`);
      // Exercise the Blob streaming path (File from drag & drop behaves the same).
      const blob = new File([await resp.blob()], name);
      const r = {};
      r.supports = await fr.supportsFile(blob);
      const raw = await fr.FlashRaw.open(blob);
      r.metadata = { format: raw.metadata.format, camera: raw.metadata.camera.name, rawWidth: raw.metadata.rawWidth };
      const p = await raw.preview();
      if (p) {
        r.preview = { mimeType: p.mimeType, bytes: p.data.length, width: p.width, height: p.height };
        if (p.mimeType === 'image/jpeg') {
          const bmp = await createImageBitmap(new Blob([p.data], { type: p.mimeType }));
          r.preview.bitmap = [bmp.width, bmp.height];
        }
      }
      const u16 = await raw.decode({ output: 'raw-u16' });
      r.raw = { width: u16.width, height: u16.height, hash: fnv1a64U16(u16.data), backend: u16.backend, timings: u16.timings };
      const rgba = await raw.decode({ output: 'rgba8' });
      const img = rgba.toImageData();
      const c = document.getElementById('c');
      c.width = img.width; c.height = img.height;
      c.getContext('2d').putImageData(img, 0, 0);
      const px = c.getContext('2d').getImageData(img.width >> 1, img.height >> 1, 1, 1).data;
      r.rgba = { width: rgba.width, height: rgba.height, bytes: rgba.data.length, isClamped: rgba.data instanceof Uint8ClampedArray, center: [...px], timings: rgba.timings };
      if (q.get('gpu') !== '1') {
        const gpu = await raw.decode({ backend: 'gpu', output: 'raw-u16' });
        r.gpu = { kind: gpu.backend.kind, fallbackReason: gpu.backend.fallbackReason };
        r.gpuError = await raw.decode({ backend: 'gpu', fallback: 'error' }).then(() => null, (e) => ({ name: e.name, kind: e.kind }));
      }
      raw.close();
      out.files[name] = r;
    }
    // Errors are structured in the browser too.
    out.garbage = await fr.FlashRaw.open(new Uint8Array(512)).then(() => null, (e) => ({ name: e.name, kind: e.kind, isFlashRawError: e instanceof fr.FlashRawError }));
    // Worker pool: decode off the main thread.
    if (q.get('worker') === '1') {
      const pool = createWorkerPool({ size: 2 });
      const name = (q.get('files') ?? '').split(',')[0];
      const blob = await (await fetch(`/tests/fixtures/${name}`)).blob();
      const [a, b] = await Promise.all([pool.decode(blob), pool.decode(await blob.arrayBuffer(), { transfer: true })]);
      out.worker = { a: fnv1a64U16(a.data), b: fnv1a64U16(b.data), caps: await pool.getCapabilities() };
      // Cancellation: a running request terminates its worker, the pool carries on.
      const ac = new AbortController();
      const running = pool.decode(blob, { output: 'rgba8', signal: ac.signal });
      ac.abort();
      out.worker.aborted = await running.then(() => 'resolved', (e) => e.name);
      out.worker.after = fnv1a64U16((await pool.decode(blob)).data);
      pool.terminate();
    }
    return out;
  }
  run().then((r) => { window.__result = r; }, (e) => { window.__result = { error: String(e?.stack ?? e) }; });
</script>
</body>
</html>
