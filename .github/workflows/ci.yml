# Fast PR CI: formatting, lints, unit/integration tests on all major platforms,
# WASM build, fuzz smoke tests, camera-db validation, bench compilation.
name: CI

# Manual only: CI runs locally (tools/ci/local.sh, docs/testing.md).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p flashraw --all-features -- -D warnings
      # Unit tests in a debug build too: overflow checks catch arithmetic bugs that
      # release builds silently wrap.
      - run: cargo test --lib -p flashraw-core -p flashraw-codecs -p flashraw-formats -p flashraw

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Library (default features + serde): 1.85.
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check -p flashraw --features serde
      # gpu feature, CLI, WASM bindings and the C API crates: 1.87;
      # jpegxl feature: 1.88.
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets --all-features

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - name: No-default-features build (no rayon/simd/mmap)
        run: cargo test -p flashraw --no-default-features --release --lib
      - name: Small regression corpus sample
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 tools/corpus/fetch.py --max-size-mb 12 --filter "Leica/|Pentax/K-70|Blackmagic" --jobs 8
          cargo test --release -p flashraw --test regression
          cargo test --release -p flashraw --test malformed

  c-api:
    # Build and install the C/C++ API with CMake, then build the C and C++ examples against the
    # install (find_package) and run them. (`cargo test --workspace` in the test job covers the
    # Rust-side ABI tests and builds the C/C++ clients of both C APIs on Linux and macOS.)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install the C API
        shell: bash
        run: |
          cmake -S crates/flashraw-capi -B build/capi -DCMAKE_BUILD_TYPE=Release -DFLASHRAW_CARGO_TARGET_DIR="$PWD/target"
          cmake --build build/capi --config Release
          cmake --install build/capi --prefix "$PWD/build/prefix" --config Release
      - name: Build and run the C and C++ examples against the install
        shell: bash
        run: |
          cmake -S examples -B build/examples -DCMAKE_PREFIX_PATH="$PWD/build/prefix" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/examples --config Release
          ctest --test-dir build/examples -C Release --output-on-failure
      - name: Link through pkg-config
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$(dirname "$(find "$PWD/build/prefix" -name flashraw.pc)")"
          libdir="$(pkg-config --variable=libdir flashraw)"
          cc -std=c99 examples/c/flashraw_info.c $(pkg-config --cflags --libs flashraw) -Wl,-rpath,"$libdir" -o build/info
          ./build/info npm/tests/fixtures/canon-5d3-mlv.dng
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Compatibility C API with MSVC (C client)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p flashraw-libraw-compat
          New-Item -ItemType Directory -Force build/compat | Out-Null
          cl /nologo /W3 /Icrates/flashraw-libraw-compat/include crates/flashraw-libraw-compat/tests/c/libraw_client.c target/release/raw.dll.lib /Fe:build/compat/libraw_client.exe /Fo:build/compat/
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target/release/raw.dll build/compat/
          ./build/compat/libraw_client.exe npm/tests/fixtures/canon-a410-chdk.dng
          if ($LASTEXITCODE -ne 0) { exit 1 }

  c-header:
    # include/flashraw.h is generated by cbindgen and checked in: it must be up to date.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cbindgen --locked --version 0.29.4
      - run: cbindgen --config crates/flashraw-capi/cbindgen.toml --crate flashraw-capi --output crates/flashraw-capi/include/flashraw.h
      - name: Fail if the checked-in header is stale
        run: git diff --exit-code -- crates/flashraw-capi/include/flashraw.h

  camera-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p flashraw-cli -- camera-db validate camera-db/cameras.json
      - run: python3 tools/support_matrix.py --check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p flashraw-wasm --target wasm32-unknown-unknown --release
      - run: RUSTFLAGS="-C target-feature=+simd128" cargo build -p flashraw-wasm --target wasm32-unknown-unknown --release
      - run: cargo check -p flashraw-gpu --target wasm32-unknown-unknown

  gpu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p flashraw-cli --features gpu --release
      - run: cargo test -p flashraw-gpu --release   # skips gracefully without an adapter

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: fuzz }
      - run: cargo install cargo-fuzz --locked
      - name: Replay crash regressions and fuzz each target briefly
        run: |
          cd fuzz
          cargo fuzz build -O
          for t in $(cargo fuzz list); do
            if [ -d regressions/$t ]; then ./target/x86_64-unknown-linux-gnu/release/$t regressions/$t/*; fi
            cargo fuzz run -O $t -- -max_total_time=30 -rss_limit_mb=2048
          done

  bench-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run
