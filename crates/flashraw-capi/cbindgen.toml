# Generates include/flashraw.h. Regenerate after changing the exported API:
#
#   cbindgen --config crates/flashraw-capi/cbindgen.toml --crate flashraw-capi \
#            --output crates/flashraw-capi/include/flashraw.h
#
# CI fails when the checked-in header differs from the generated one.

language = "C"
cpp_compat = true
include_guard = "FLASHRAW_H"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
documentation = true
documentation_style = "doxy"
style = "both"
usize_is_size_t = true
line_length = 100
tab_width = 4
header = """
/*
 * FlashRaw C API.
 *
 * Generated by cbindgen from crates/flashraw-capi. Do not edit: change the Rust sources
 * and regenerate (see crates/flashraw-capi/cbindgen.toml).
 *
 * Documentation: docs/c-api.md. Licensed under MIT OR Apache-2.0.
 *
 * Conventions:
 *  - Fallible functions return a flashraw_status (FLASHRAW_OK == 0); details of the last
 *    failure on the calling thread are available from flashraw_last_error_message().
 *    Getters that return a value return 0 / false / NULL on error and also set the last
 *    error.
 *  - Enum-typed fields and parameters are int32_t; the matching enum lists the values.
 *  - Structs with a leading `size` field are versioned: initialise them with the matching
 *    _init() function (inputs) or set `size = sizeof(struct)` (outputs).
 *  - Strings are NUL-terminated UTF-8. Strings returned as `const char *` are owned by the
 *    library (see each function for their lifetime); `char *` results must be released with
 *    flashraw_string_free().
 */"""
trailer = """
#define FLASHRAW_VERSION_ENCODE(major, minor, patch) (((major) << 16) | ((minor) << 8) | (patch))
"""

[export]
include = [
    "flashraw_status",
    "flashraw_backend",
    "flashraw_output_format",
    "flashraw_demosaic",
    "flashraw_corruption_policy",
    "flashraw_sample_type",
    "flashraw_cfa_color",
    "flashraw_sensor_layout",
    "flashraw_preview_encoding",
    "flashraw_preview_kind",
    "flashraw_matrix_kind",
    "flashraw_color_source",
    "flashraw_stage",
    "flashraw_string_key",
]

[enum]
rename_variants = "None"

[parse]
parse_deps = false
