[package]
name = "flashraw-cli"
description = "The flashraw command-line tool: inspect, decode, convert and benchmark camera RAW files"
version.workspace = true
edition.workspace = true
rust-version = "1.87"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashraw-cli"
readme = "README.md"
keywords = ["raw", "camera", "cli", "dng", "image"]
categories = ["command-line-utilities", "multimedia::images"]
include = ["src/**", "data/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "flashraw"
path = "src/main.rs"

[features]
default = []
gpu = ["flashraw/gpu"]
jpegxl = ["flashraw/jpegxl"]

[dependencies]
flashraw = { workspace = true, features = ["serde", "rayon", "simd", "mmap", "icc"] }
flashraw-camera-db = { workspace = true, features = ["tooling"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
jpeg-encoder.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
