[package]
name = "flashraw-cli"
description = "The flashraw command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "flashraw"
path = "src/main.rs"

[features]
default = []
gpu = ["flashraw/gpu"]
jpegxl = ["flashraw/jpegxl"]

[dependencies]
flashraw = { workspace = true, features = ["serde"] }
flashraw-camera-db = { workspace = true, features = ["tooling"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
jpeg-encoder.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
