[package]
name = "flashraw-gpu"
description = "Optional wgpu/WebGPU compute backend for FlashRaw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flashraw-core.workspace = true
wgpu.workspace = true
bytemuck.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[dev-dependencies]
flashraw = { workspace = true, features = ["gpu", "rayon", "simd", "mmap"] }
flashraw-codecs.workspace = true
# Offline WGSL validation (same naga as wgpu 30) so shader errors are caught without a GPU.
naga = { version = "30", features = ["wgsl-in"] }

[[bench]]
name = "gpu_pipeline"
harness = false

[lints]
workspace = true
