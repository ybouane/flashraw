[package]
name = "flashraw-camera-db"
description = "Camera database (aliases, crops, levels, CFA, colour matrices, quirks) for FlashRaw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
build = "build.rs"
include = ["src/**", "build.rs", "data/**", "Cargo.toml"]

[features]
# Validate/compare tooling used by `flashraw camera-db ...` (not needed at runtime).
tooling = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true, features = ["preserve_order"] }

[build-dependencies]
serde_json.workspace = true
serde.workspace = true

[lints]
workspace = true
