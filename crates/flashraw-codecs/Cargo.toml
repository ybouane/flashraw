[package]
name = "flashraw-codecs"
description = "RAW compression codecs (lossless JPEG, packed, vendor entropy coders) for FlashRaw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["rayon", "simd"]
rayon = ["flashraw-core/rayon", "dep:rayon"]
simd = ["flashraw-core/simd"]
jpegxl = ["dep:jxl-oxide"]

[dependencies]
flashraw-core.workspace = true
rayon = { workspace = true, optional = true }
zune-inflate.workspace = true
zlib-rs.workspace = true
zune-jpeg.workspace = true
jxl-oxide = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
