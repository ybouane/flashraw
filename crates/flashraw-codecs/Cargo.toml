[package]
name = "flashraw-codecs"
description = "Internal crate of FlashRaw: RAW compression codecs (lossless JPEG, packed bits, vendor entropy coders). Use the `flashraw` crate instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashraw-codecs"
readme = "README.md"
keywords = ["raw", "camera", "codec", "jpeg", "decoder"]
categories = ["multimedia::images", "compression"]
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["rayon", "simd"]
rayon = ["flashraw-core/rayon", "dep:rayon"]
simd = ["flashraw-core/simd"]
jpegxl = ["dep:jxl-oxide"]

[dependencies]
flashraw-core.workspace = true
rayon = { workspace = true, optional = true }
zune-inflate.workspace = true
zlib-rs.workspace = true
zune-jpeg.workspace = true
jxl-oxide = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
