[package]
name = "flashraw-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
flashraw = { path = "../crates/flashraw", default-features = false, features = ["simd", "icc"] }
flashraw-core = { path = "../crates/flashraw-core", default-features = false }
flashraw-codecs = { path = "../crates/flashraw-codecs", default-features = false }

# Not part of the main workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "open_decode"
path = "fuzz_targets/open_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tiff_parse"
path = "fuzz_targets/tiff_parse.rs"
test = false
doc = false
bench = false

